    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handlers.selectState(n.id); } });

  };
  drawState(model.root, gStates);

  // initial markers
  for (const n of model.all) {
    for (const s of n.initial || []) {
      const b = boxes.get(s.id); if (!b) continue;
      const x = b.x + Math.min(18, b.w / 4);
      el("circle", { cx: x, cy: b.y - 18, r: 5 }, gInit);
      el("path", { d: `M${x},${b.y - 13} L${x},${b.y - 1}`, "marker-end": "url(#ah)" }, gInit);

  // edges: classify each route, spread the ports on each side, then draw
  const contains = (o, i) => i.x >= o.x && i.y >= o.y && i.x + i.w <= o.x + o.w && i.y + i.h <= o.y + o.h;
  const lcaOf = (p, q) => { const anc = new Set(); for (let x = p.parent; x; x = x.parent) anc.add(x); for (let x = q.parent; x; x = x.parent) if (anc.has(x)) return x; return model.root; };
  const leaves = [...boxes.values()].filter((b) => b.node.kind !== "scxml" && !(b.kids && b.kids.length));
  const clearBetween = (A, B) => {
    const ax = A.x + A.w / 2; const bx = B.x + B.w / 2;
    const r = { x: Math.min(ax, bx) - 14, y: B.y + B.h, w: Math.abs(ax - bx) + 28, h: A.y - (B.y + B.h) };
    return !leaves.some((o) => o !== A && o !== B && o.x < r.x + r.w && r.x < o.x + o.w && o.y < r.y + r.h && r.y < o.y + o.h);

  const routes = [];
  const loopIdx = new Map();
  for (const t of model.transitions) {
    if (t.source.kind === "history") continue;

      const A = boxes.get(t.source.id); const B = boxes.get(tg.id);

      else if (B.y >= A.y + A.h - 1) kind = "down";
      else if (B.y + B.h <= A.y + 1) kind = clearBetween(A, B) ? "upDirect" : "up";
      else kind = (A.x < B.x ? B.x - (A.x + A.w) : A.x - (B.x + B.w)) <= G.colGap + (A.loopRoom || 0) + (B.loopRoom || 0) + 2 ? "beside" : "over";
      const r = { t, A, B, kind };
      if (kind === "self") { r.idx = loopIdx.get(A.id) || 0; loopIdx.set(A.id, r.idx + 1); }

  const ports = new Map();
  const addPort = (box, side, r, end, other) => { const k = box.id + "|" + side; if (!ports.has(k)) ports.set(k, []); ports.get(k).push({ r, end, other }); };
  const mx = (b) => b.x + b.w / 2; const my = (b) => b.y + b.h / 2;
  for (const r of routes) {
    if (r.kind === "down") { addPort(r.A, "bottom", r, 0, mx(r.B)); addPort(r.B, "top", r, 1, mx(r.A)); }
    else if (r.kind === "upDirect") { addPort(r.A, "top", r, 0, mx(r.B)); addPort(r.B, "bottom", r, 1, mx(r.A)); }
    else if (r.kind === "up") { addPort(r.A, "right", r, 0, -my(r.B)); addPort(r.B, "right", r, 1, -my(r.A)); }
    else if (r.kind === "over") { addPort(r.A, "top", r, 0, mx(r.B)); addPort(r.B, "top", r, 1, mx(r.A)); }
    else if (r.kind === "beside") { const right = r.A.x < r.B.x; addPort(r.A, right ? "right" : "left", r, 0, my(r.B)); addPort(r.B, right ? "left" : "right", r, 1, my(r.A)); }
  }
  for (const [k, list] of ports) {
    const [id, side] = k.split("|"); const b = boxes.get(id);
    list.sort((p, q) => p.other - q.other || (p.r.kind === "down" ? 0 : 1) - (q.r.kind === "down" ? 0 : 1) || p.r.t.order - q.r.t.order);
    const horiz = side === "top" || side === "bottom";
    const len = horiz ? b.w : b.h; const from = horiz ? b.x : b.y;
    const usable = horiz ? Math.min(len * 0.7, len - 24) : len * 0.6;
    list.forEach((p, i) => {
      const at = from + (len - usable) / 2 + usable * (i + 1) / (list.length + 1);
      p.r[p.end ? "e" : "s"] = side === "top" ? { x: at, y: b.y } : side === "bottom" ? { x: at, y: b.y + b.h } : side === "right" ? { x: b.x + b.w, y: at } : { x: b.x, y: at };
      if (!p.end && horiz && list.length > 1) p.r.side = at < b.x + b.w / 2 ? "left" : "right";
    });
  }
  const laneUsed = new Map();
  for (const r of routes) {
    const { A, B } = r; let { s, e } = r; let d; let cands;
    if (r.kind === "self") {
      const x = A.x; const y = A.y + A.h / 2; const k = 22 + r.idx * G.lane;
      d = `M${x},${y - 8} C${x - k},${y - 8 - k} ${x - k},${y + 8 + k} ${x},${y + 8}`;
      cands = [0, -22, 22].map((dy) => ({ x: x - k * 0.75 - 6, y: y + dy, end: true }));
    } else if (r.kind === "down") {
      const dy = Math.max(30, (e.y - s.y) / 2);
      const p = [s, { x: s.x, y: s.y + dy }, { x: e.x, y: e.y - dy }, e];
      d = `M${s.x},${s.y} C${p[1].x},${p[1].y} ${p[2].x},${p[2].y} ${e.x},${e.y}`;
      cands = [0.5, 0.38, 0.62, 0.28, 0.72, 0.18, 0.82].map((t) => cubicAt(p, t));
    } else if (r.kind === "upDirect") {
      const dy = Math.max(30, (s.y - e.y) / 2);
      const p = [s, { x: s.x, y: s.y - dy }, { x: e.x, y: e.y + dy }, e];
      d = `M${s.x},${s.y} C${p[1].x},${p[1].y} ${p[2].x},${p[2].y} ${e.x},${e.y}`;
      cands = [0.5, 0.38, 0.62, 0.28, 0.72].map((t) => cubicAt(p, t));
    } else if (r.kind === "up") {
      const lca = lcaOf(A.node, B.node); const lb = boxes.get(lca.id);
      const used = laneUsed.get(lca.id) || 0; laneUsed.set(lca.id, used + 1);
      const base = lb && lb.laneX !== undefined && lca.kind !== "parallel" ? lb.laneX : Math.max(s.x, e.x) + 20;
      const X = Math.max(base + used * G.lane, Math.max(s.x, e.x) + 16); const rr = 8;
      d = `M${s.x},${s.y} L${X - rr},${s.y} Q${X},${s.y} ${X},${s.y - rr} L${X},${e.y + rr} Q${X},${e.y} ${X - rr},${e.y} L${e.x},${e.y}`;
      cands = [0.5, 0.35, 0.65, 0.2, 0.8].map((t) => ({ x: X, y: s.y + (e.y - s.y) * t }));
    } else if (r.kind === "over") {
      const top = Math.min(A.y, B.y) - 34 - Math.abs(e.x - s.x) * 0.08;
      const p = [s, { x: s.x, y: top }, { x: e.x, y: top }, e];
      d = `M${s.x},${s.y} C${p[1].x},${p[1].y} ${p[2].x},${p[2].y} ${e.x},${e.y}`;
      cands = [0.5, 0.35, 0.65].map((t) => cubicAt(p, t));
    } else if (r.kind === "beside") {
      const m = (s.x + e.x) / 2;
      const p = [s, { x: m, y: s.y }, { x: m, y: e.y }, e];
      d = `M${s.x},${s.y} C${m},${s.y} ${m},${e.y} ${e.x},${e.y}`;
      cands = [0.5].map((t) => cubicAt(p, t)).flatMap((c) => [c, { x: c.x, y: c.y - 22 }, { x: c.x, y: c.y + 22 }]);
    } else {
      const inner = contains(A, B) ? B : A; const outer = inner === A ? B : A;
      s = { x: A.x, y: A === inner ? A.y + A.h / 2 : A.y + 40 }; e = { x: B.x, y: B === inner ? B.y + B.h / 2 : B.y + 40 };
      const X = outer.x + 10;
      d = `M${s.x},${s.y} C${X - 30},${s.y} ${X - 30},${e.y} ${e.x},${e.y}`;
      cands = [{ x: X - 10, y: (s.y + e.y) / 2 }];
    }
    r.d = d; r.cands = cands;
  }
  const trG = new Map();
  for (const t of model.transitions) {
    if (t.source.kind === "history") continue;
    const g = el("g", { class: "tr", "data-id": t.id }, gEdges);
    const lg = el("g", { class: "tr", tabindex: 0, role: "button", "data-id": t.id, "aria-label": "Transition " + t.id + ": " + edgeLabel(t) }, gLabels);
    for (const x of [g, lg]) x.addEventListener("click", (e) => { e.stopPropagation(); handlers.selectTransition(t.id); });
    lg.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handlers.selectTransition(t.id); } });
    trEls.set(t.id, [g, lg]); trG.set(t.id, { g, lg });
  }
  for (const r of routes) {
    const { g } = trG.get(r.t.id);
    el("path", { class: "hit", d: r.d }, g);
    el("path", { class: "edge" + (r.t.targets.length ? "" : " targetless"), d: r.d, "marker-end": "url(#ah)" }, g);
  }
  // labels: first candidate point that hits no box, title, or other label
  const obstacles = [];
  for (const b of boxes.values()) {
    if (b.node.kind === "scxml") continue;
    if (b.kids && b.kids.length) { if (b.node.kind !== "scxml") obstacles.push({ x: b.x, y: b.y, w: textW(b.id, 13, 700) + 28, h: 28 }); }
    else obstacles.push({ x: b.x - 2, y: b.y - 2, w: b.w + 4, h: b.h + 4 });
  }
  const overlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));

  for (const r of routes) {
    const text = edgeLabel(r.t); const w = textW(text, 12) + 12; const hgt = 20;

    }
    placed.push({ ...best, x: best.x - 2, w: best.w + 4 });
    const lg = trG.get(r.t.id).lg;
    el("rect", { class: "lab", x: best.x, y: best.y, width: best.w, height: best.h, rx: 4 }, lg);
    const tx = el("text", { x: best.x + 6, y: best.y + 14 }, lg); tx.textContent = text;
  }

  const bb = svg.getBBox();

  const vb = { x: bb.x - m, y: bb.y - m, w: bb.width + 2 * m, h: bb.height + 2 * m };

/* ---------- Calculation: prose to safe HTML ---------- */

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function makeProse(glossary) {
  const terms = (glossary || []).map((g) => g.term).filter(Boolean).sort((a, b) => b.length - a.length);
  const defOf = new Map((glossary || []).map((g) => [g.term.toLowerCase(), g.definition]));
  const re = terms.length ? new RegExp("\\b(" + terms.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")(s|es|ed|d)?\\b", "gi") : null;
  return (text) => String(text || "").split("`").map((part, i) => {
    if (i % 2) return "<code>" + esc(part) + "</code>";
    if (!re) return esc(part);
    let out = ""; let last = 0;
    part.replace(re, (m, term, _suf, at) => {
      out += esc(part.slice(last, at));
      out += `<span class="term" tabindex="0" title="${esc(defOf.get(term.toLowerCase()) || "")}">${esc(m)}</span>`;
      last = at + m.length; return m;
    });
    return out + esc(part.slice(last));
  }).join("");
}
function sourceLinks(ref, repo) {
  if (!ref) return "<em>The source is not known.</em>";
  return ref.split(",").map((r) => r.trim()).filter(Boolean).map((r) => {
    const m = r.match(/^(.*?):(\d+)(?:-(\d+))?$/);
    if (!m || !repo || !repo.url) return "<code>" + esc(r) + "</code>";
    const href = `${repo.url.replace(/\/$/, "")}/blob/${encodeURIComponent(repo.rev || "HEAD")}/${m[1].split("/").map(encodeURIComponent).join("/")}#L${m[2]}${m[3] ? "-L" + m[3] : ""}`;
    return `<a href="${esc(href)}" target="_blank" rel="noopener"><code>${esc(r)}</code></a>`;
  }).join(", ");
}
function describeAction(a) {
  const at = a.attrs;
  switch (a.tag) {
    case "raise": return `Sends the event <code>${esc(at.event)}</code> to the same machine.`;
    case "send": return at.delay || at.delayexpr
      ? `Starts a timer${at.id ? " <code>" + esc(at.id) + "</code>" : ""}. After <code>${esc(at.delay || at.delayexpr)}</code>, the timer sends <code>${esc(at.event || at.eventexpr)}</code>.`
      : `Sends the event <code>${esc(at.event || at.eventexpr)}</code>.`;
    case "cancel": return `Stops the timer <code>${esc(at.sendid || at.sendidexpr)}</code>.`;
    case "assign": return `Sets <code>${esc(at.location)}</code> to <code>${esc(at.expr)}</code>.`;
    case "log": return `Writes an entry in the record${at.label ? " <code>" + esc(at.label) + "</code>" : ""}.`;
    default: return `Does <code>&lt;${esc(a.tag)}&gt;</code>. This page does not show the result.`;
  }
}

/* ---------- Self-check (also exposed as window.statechartSelfTest) ---------- */

function selfTest(model, info) {
  const errors = []; const warnings = [];
  const need = (obj, keys, what) => keys.forEach((k) => { if (!obj || !obj[k] || !obj[k].meaning) errors.push(`The ${what} \`${k}\` has no meaning in the prose.`); });
  need(info.states, model.all.filter((n) => n.kind !== "scxml").map((n) => n.id), "state");
  need(info.events, model.events, "event");
  need(info.conditions, Object.keys(model.data), "condition");
  need(info.transitions, model.transitions.map((t) => t.id), "transition");
  if (!info.scenarios || !info.scenarios.length) errors.push("The prose has no scenario.");
  const fired = new Set();
  (info.scenarios || []).forEach((sc, si) => {
    const m = makeMachine(model);
    (sc.steps || []).forEach((step, i) => {
      for (const [k, v] of Object.entries(step.set || {})) {
        if (!(k in model.data)) errors.push(`Scenario ${si + 1}, step ${i + 1}: \`${k}\` is not a condition.`);
        m.setData(k, !!v);
      }
      if (step.event) {
        const taken = m.fire(step.event);
        if (!taken.length) errors.push(`Scenario "${sc.name}", step ${i + 1}: the event \`${step.event}\` has no effect.`);
        taken.forEach((t) => fired.add(t.id));
      }
    });
  });
  model.transitions.filter((t) => !fired.has(t.id) && t.source.kind !== "history").forEach((t) => warnings.push(`No scenario fires the transition \`${t.id}\`.`));
  return { errors, warnings };
}

  return e;
}

        <div class="legend">
          <span><i class="sw" style="background:var(--hot);border-color:var(--hot)"></i>Active state</span>
          <span><i class="sw" style="border-width:3px"></i>Thick arrow: the transition can occur at this time</span>
          <span><i class="sw" style="border-style:double;border-width:4px"></i>End state</span>
          <span><svg width="24" height="12" aria-hidden="true"><circle cx="5" cy="6" r="4" fill="#171412"/><path d="M9,6 L22,6" stroke="#171412" stroke-width="1.6"/></svg>First state</span>
        </div>
      </div>
      <div class="card" id="side">
        <div><span>Active states: </span><span class="now" id="now"></span></div>
        <h3>Send an event</h3><div class="events" id="events"></div>
        <div id="conds-wrap"><h3>Conditions</h3><div class="conds" id="conds"></div></div>
        <div id="timers-wrap"><h3>Active timers</h3><div class="timers" id="timers"></div></div>
        <div class="events"><button type="button" id="back">Back</button><button type="button" id="reset">Start again</button></div>
        <h3>Information</h3><div class="detail" id="detail"><p>Select a box or an arrow in the chart.</p></div>
        <details><summary>Record of steps</summary><ol class="log" id="log"></ol></details>
      </div>
    </div>`;
  app.appendChild(play);

  // reference tables
  const ref = h("section", { id: "reference" });
  const stateRows = model.all.filter((n) => n.kind !== "scxml").map((n) => `<tr><td><button type="button" class="linklike" data-state="${esc(n.id)}"><code>${esc(n.id)}</code></button></td><td>${kindText(n)}</td><td>${meaning(info.states, n.id)}</td><td>${sourceLinks(n.sourceRef, info.repo)}</td></tr>`).join("");
  const evRows = model.events.map((e) => {
    const ts = model.transitions.filter((t) => t.events.some((d) => d === e || e.startsWith(d.replace(/\.\*$/, "") + ".")));
    const ev = (info.events || {})[e] || {};
    return `<tr><td><code>${esc(e)}</code></td><td>${meaning(info.events, e)}</td><td>${ev.origin ? P(ev.origin) : ""}</td><td>${ts.map((t) => `<button type="button" class="linklike" data-tr="${esc(t.id)}">${esc(t.source.id)} → ${esc(t.targets.map((x) => x.id).join(", ") || t.source.id)}</button>`).join("<br>")}</td></tr>`;
  }).join("");
  const condRows = Object.keys(model.data).map((k) => `<tr><td><code>${esc(k)}</code></td><td>${meaning(info.conditions, k)}</td><td><code>${esc(model.data[k])}</code></td></tr>`).join("");
  const trRows = model.transitions.map((t) => `<tr><td><button type="button" class="linklike" data-tr="${esc(t.id)}"><code>${esc(t.id)}</code></button></td><td><code>${esc(t.source.id)}</code> → <code>${esc(t.targets.map((x) => x.id).join(", ") || "(stays)")}</code></td><td>${esc(edgeLabel(t))}</td><td>${meaning(info.transitions, t.id)}</td><td>${sourceLinks(t.sourceRef, info.repo)}</td></tr>`).join("");
  ref.innerHTML = `<h2>All parts of the machine</h2>
    <h3>States</h3><div class="table-wrap"><table><thead><tr><th>State</th><th>Type</th><th>Information</th><th>Code</th></tr></thead><tbody>${stateRows}</tbody></table></div>
    <h3>Events</h3><div class="table-wrap"><table><thead><tr><th>Event</th><th>Information</th><th>Source of the event</th><th>Transitions</th></tr></thead><tbody>${evRows}</tbody></table></div>
    ${condRows ? `<h3>Conditions</h3><div class="table-wrap"><table><thead><tr><th>Condition</th><th>Information when <code>true</code></th><th>Value at the start</th></tr></thead><tbody>${condRows}</tbody></table></div>` : ""}
    <h3>Transitions</h3><div class="table-wrap"><table><thead><tr><th>Id</th><th>From → to</th><th>Event [condition]</th><th>Information</th><th>Code</th></tr></thead><tbody>${trRows}</tbody></table></div>`;
  app.appendChild(ref);

  if ((info.notes || []).length) app.appendChild(h("section", { id: "notes" }, `<h2>Notes and risks</h2>${info.notes.map((n) => `<h3>${esc(n.title || "")}</h3><p>${P(n.text)}</p>`).join("")}`));
  if ((info.evidence || []).length) app.appendChild(h("section", { id: "evidence" }, `<h2>Where this machine is in the code</h2><ul>${info.evidence.map((e) => `<li>${sourceLinks(e.source, info.repo)}: ${P(e.note)}</li>`).join("")}</ul>`));
  if ((info.related || []).length) app.appendChild(h("section", { id: "related" }, `<h2>Related machines</h2><ul>${info.related.map((r) => `<li><a href="${esc(r.href)}">${esc(r.title)}</a></li>`).join("")}</ul>`));
  const src = h("section", { id: "source" });
  src.innerHTML = `<h2>SCXML source</h2><p>This is the chart in SCXML, a standard of the W3C. Other software can read and use it.</p>
    <div class="events"><button type="button" id="copy">Copy</button><button type="button" id="download">Download</button></div>
    <details><summary>Show the source</summary><pre class="src"><code></code></pre></details>`;
  src.querySelector("pre code").textContent = scxmlText;
  app.appendChild(src);

  function kindText(n) {
    if (n.kind === "final") return "End state";
    if (n.kind === "history") return n.historyType === "deep" ? "History (all levels)" : "History";
    if (n.kind === "parallel") return "Parallel group: all its parts are active at the same time";
    if (n.children.some((c) => STATE_KINDS.has(c.kind))) return n.parent && n.parent.kind === "parallel" ? "Group of states (a parallel part)" : "Group of states";
    return "State";
  }

  // machine + chart
  const machine = makeMachine(model);
  const svg = document.getElementById("svg");
  let selected = null; let lastTaken = []; const undo = [];
  const draw = drawChart(svg, model, layout(model, info.layout), {
    selectState: (id) => { selected = { kind: "state", id }; refresh(); },
    selectTransition: (id) => { selected = { kind: "tr", id }; refresh(); },
  });
  let zoom = 1;
  const applyZoom = () => {
    const wrapW = svg.parentElement.clientWidth || 600;
    const fitW = Math.max(Math.min(wrapW, draw.vb.w * 1.1), Math.min(draw.vb.w * 0.8, wrapW * 2.2));
    svg.setAttribute("width", Math.round(fitW * zoom));
    svg.setAttribute("height", Math.round(fitW * zoom * draw.vb.h / draw.vb.w));
  };
  play.querySelectorAll("[data-zoom]").forEach((b) => b.addEventListener("click", () => {
    const z = b.dataset.zoom; zoom = z === "fit" ? 1 : Math.max(0.5, Math.min(4, zoom * (z === "in" ? 1.25 : 0.8))); applyZoom();
  }));
  window.addEventListener("resize", applyZoom);
  applyZoom();

  const fire = (ev) => {
    undo.push(machine.snapshot());
    lastTaken = machine.fire(ev).map((t) => t.id);
    refresh();
  };

  function refresh() {
    const active = machine.active();
    const st = machine.state;
    for (const [id, g] of draw.stateEls) {
      g.classList.toggle("active", active.has(id));
      g.classList.toggle("selected", !!selected && selected.kind === "state" && selected.id === id);
    }
    const enabledIds = new Set(model.events.flatMap((e) => machine.enabledFor(e).map((t) => t.id)));
    for (const [id, gs] of draw.trEls) for (const g of gs) {
      g.classList.toggle("enabled", enabledIds.has(id));
      g.classList.toggle("hot", lastTaken.includes(id));
      g.classList.toggle("selected", !!selected && selected.kind === "tr" && selected.id === id);
      g.querySelectorAll("path.edge").forEach((p) => p.setAttribute("marker-end", lastTaken.includes(id) ? "url(#ah-hot)" : "url(#ah)"));
    }
    const leaves = [...st.config].filter(machine.isAtomic).sort((a, b) => a.order - b.order).map((s) => s.id);
    document.getElementById("now").innerHTML = st.running ? leaves.map((x) => `<code>${esc(x)}</code>`).join(", ") : `<code>${esc(leaves.join(", "))}</code> (the machine is at its end)`;
    const evBox = document.getElementById("events"); evBox.textContent = "";
    for (const e of model.events) {
      const ok = machine.enabledFor(e).length > 0;
      const blocked = !ok && machine.blockedFor(e).length > 0;
      const b = h("button", { type: "button", title: ok ? "Send this event" : blocked ? "A condition stops this event at this time" : "This event has no effect at this time" });
      b.innerHTML = `<code>${esc(e)}</code>${blocked ? " (stopped by a condition)" : ""}`;
      b.disabled = !ok; b.addEventListener("click", () => fire(e));
      evBox.appendChild(b);
    }
    const condBox = document.getElementById("conds"); condBox.textContent = "";
    document.getElementById("conds-wrap").hidden = !Object.keys(model.data).length;
    for (const k of Object.keys(model.data)) {
      const lab = h("label", { class: "cond", title: (info.conditions && info.conditions[k] && info.conditions[k].meaning) || "" });
      const cb = h("input", { type: "checkbox" }); cb.checked = !!st.data[k];
      cb.addEventListener("change", () => { undo.push(machine.snapshot()); machine.setData(k, cb.checked); lastTaken = machine.state.taken.map((t) => t.id); refresh(); });
      lab.appendChild(cb); lab.appendChild(h("code", {}, esc(k)));
      condBox.appendChild(lab);
    }
    const tBox = document.getElementById("timers"); tBox.textContent = "";
    document.getElementById("timers-wrap").hidden = !st.timers.length;
    for (const t of st.timers) {
      const b = h("button", { type: "button" }, `Let the timer <code>${esc(t.id || t.event)}</code> end (${esc(t.delay)})`);
      b.addEventListener("click", () => fire(t.event)); tBox.appendChild(b);
    }
    document.getElementById("back").disabled = !undo.length;
    document.getElementById("log").innerHTML = st.log.map((x) => `<li>${esc(x)}</li>`).join("");
    renderDetail(active, enabledIds);
  }

  function renderDetail(active, enabledIds) {
    const box = document.getElementById("detail");
    if (!selected) { box.innerHTML = "<p>Select a box or an arrow in the chart.</p>"; return; }
    if (selected.kind === "state") {
      const n = model.nodes.get(selected.id);
      const outs = model.transitions.filter((t) => t.source === n);
      const ins = model.transitions.filter((t) => t.targets.includes(n));
      const trList = (ts, dir) => ts.length ? `<ul>${ts.map((t) => `<li><button type="button" class="linklike" data-tr="${esc(t.id)}">${esc(edgeLabel(t))}</button> ${dir === "out" ? "to" : "from"} <code>${esc(dir === "out" ? (t.targets.map((x) => x.id).join(", ") || n.id) : t.source.id)}</code></li>`).join("")}</ul>` : "None";
      box.innerHTML = `<h3><code>${esc(n.id)}</code></h3><p>${meaning(info.states, n.id)}</p><dl>
        <dt>Type</dt><dd>${kindText(n)}</dd>
        <dt>At this time</dt><dd>${active.has(n.id) ? "The machine is in this state." : "The machine is not in this state."}</dd>
        ${n.onentry.length ? `<dt>On entry</dt><dd>${n.onentry.map(describeAction).join("<br>")}</dd>` : ""}
        ${n.onexit.length ? `<dt>On exit</dt><dd>${n.onexit.map(describeAction).join("<br>")}</dd>` : ""}
        <dt>Transitions out</dt><dd>${trList(outs, "out")}</dd>
        <dt>Transitions in</dt><dd>${trList(ins, "in")}</dd>
        <dt>Code</dt><dd>${sourceLinks(n.sourceRef, info.repo)}</dd></dl>`;
    } else {
      const t = model.transitions.find((x) => x.id === selected.id);
      const evInfo = t.events.map((e) => `<code>${esc(e)}</code>: ${meaning(info.events, e)}${(info.events || {})[e] && info.events[e].origin ? " Source: " + P(info.events[e].origin) : ""}`).join("<br>");
      const conds = [...condVars(t.cond)].map((k) => `<code>${esc(k)}</code> (<code>${machine.state.data[k] ? "true" : "false"}</code> at this time): ${meaning(info.conditions, k)}`).join("<br>");
      box.innerHTML = `<h3><code>${esc(t.id)}</code></h3><p>${meaning(info.transitions, t.id)}</p><dl>
        <dt>From</dt><dd><button type="button" class="linklike" data-state="${esc(t.source.id)}"><code>${esc(t.source.id)}</code></button></dd>
        <dt>To</dt><dd>${t.targets.length ? t.targets.map((x) => `<button type="button" class="linklike" data-state="${esc(x.id)}"><code>${esc(x.id)}</code></button>`).join(", ") : "The machine stays in the same state."}</dd>
        <dt>Event</dt><dd>${evInfo || "No event. This transition occurs when its condition changes to <code>true</code>."}</dd>
        ${t.condText ? `<dt>Condition</dt><dd><code>${esc(t.condText)}</code>${conds ? "<br>" + conds : ""}</dd>` : ""}
        ${t.actions.length ? `<dt>Also does</dt><dd>${t.actions.map(describeAction).join("<br>")}</dd>` : ""}
        <dt>At this time</dt><dd>${enabledIds.has(t.id) ? "This transition can occur." : "This transition cannot occur."}</dd>
        <dt>Code</dt><dd>${sourceLinks(t.sourceRef, info.repo)}</dd></dl>
        ${enabledIds.has(t.id) && t.events[0] ? `<button type="button" class="primary" data-fire="${esc(t.events[0])}">Send <code>${esc(t.events[0])}</code></button>` : ""}`;
    }
  }

  document.addEventListener("click", (e) => {
    const s = e.target.closest("[data-state]"); const t = e.target.closest("[data-tr]"); const f = e.target.closest("[data-fire]");
    if (f) { fire(f.dataset.fire); return; }
    if (s) { selected = { kind: "state", id: s.dataset.state }; refresh(); if (!play.contains(s)) play.scrollIntoView({ behavior: "smooth" }); }
    else if (t) { selected = { kind: "tr", id: t.dataset.tr }; refresh(); if (!play.contains(t)) play.scrollIntoView({ behavior: "smooth" }); }
  });
  document.getElementById("back").addEventListener("click", () => { if (undo.length) { machine.restore(undo.pop()); lastTaken = []; refresh(); } });
  document.getElementById("reset").addEventListener("click", () => { machine.reset(); undo.length = 0; lastTaken = []; refresh(); });
  document.getElementById("copy").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(scxmlText); e.target.textContent = "Copy done"; } catch (err) { e.target.textContent = "The copy did not work. Open the source."; }
  });
  document.getElementById("download").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([scxmlText], { type: "application/scxml+xml" }));
    a.download = model.root.name + ".scxml"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // scenario player
  const scenarios = info.scenarios || [];
  const sel = document.getElementById("scn");
  scenarios.forEach((s, i) => sel.appendChild(h("option", { value: i }, esc(s.name))));
  let si = 0; let step = 0; let timer = null;
  const playBtn = document.getElementById("playbtn");
  const showScenario = () => {
    const sc = scenarios[si] || { steps: [] };
    document.getElementById("goal").innerHTML = sc.goal ? P(sc.goal) : "";
    document.getElementById("steplist").innerHTML = sc.steps.map((s, i) =>
      `<li class="${i < step - 1 ? "done" : i === step - 1 ? "hot" : ""}">${s.event ? `<code>${esc(s.event)}</code>: ` : ""}${P(s.caption)}</li>`).join("");
  };
  const pause = () => { clearInterval(timer); timer = null; playBtn.textContent = "Play"; };
  const scReset = () => {
    pause(); step = 0; machine.reset(); undo.length = 0; lastTaken = []; selected = null;
    document.getElementById("caption").textContent = "To start, push Play or Step."; showScenario(); refresh();
  };
  const scStep = () => {
    const sc = scenarios[si]; if (!sc) return;
    if (step >= sc.steps.length) { pause(); return; }
    const s = sc.steps[step++];
    undo.push(machine.snapshot());
    lastTaken = [];
    for (const [k, v] of Object.entries(s.set || {})) { machine.setData(k, !!v); lastTaken.push(...machine.state.taken.map((t) => t.id)); }
    if (s.event) lastTaken = machine.fire(s.event).map((t) => t.id);
    selected = lastTaken.length ? { kind: "tr", id: lastTaken[lastTaken.length - 1] } : selected;
    document.getElementById("caption").innerHTML = `Step ${step} of ${sc.steps.length}: ${P(s.caption)}`;
    showScenario(); refresh();
    if (step >= sc.steps.length) pause();
  };
  const toggle = () => {
    if (timer) { pause(); return; }
    const sc = scenarios[si]; if (!sc) return;
    if (step >= sc.steps.length) scReset();
    playBtn.textContent = "Pause"; scStep(); if (step < sc.steps.length) timer = setInterval(scStep, 1800);
  };
  sel.addEventListener("change", () => { si = Number(sel.value); scReset(); });
  playBtn.addEventListener("click", toggle);
  document.getElementById("stepbtn").addEventListener("click", () => { pause(); scStep(); });
  document.getElementById("scnreset").addEventListener("click", scReset);
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === " " && e.target.closest("button, [tabindex], summary, a")) return;
    if (e.key === " ") { e.preventDefault(); toggle(); } else if (e.key === "n" || e.key === "N") { pause(); scStep(); } else if (e.key === "r" || e.key === "R") scReset();
  });
  showScenario();
  refresh();
}

boot();
})();
</script>
</body>
</html>
